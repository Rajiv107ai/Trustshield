[pytest]
pythonpath = core backend . trustshield_project
testpaths = tests
norecursedirs = data external synthetic_data_export .venv .git models scripts
addopts = -m "not clip"
# CLIP integration tests require transformers and ABO images; run explicitly via `pytest -m clip`.
filterwarnings =
    # torch.jit.script is unsupported on Python 3.14+; upstream torch issue
    ignore:.*torch\.jit\.script.*:FutureWarning:torch
    # torch_geometric uses a deprecated internal typing API; upstream issue
    ignore:.*type_params.*:DeprecationWarning:torch_geometric
    # fastapi / starlette testclient deprecations
    ignore:.*Using `httpx` with `starlette\.testclient` is deprecated.*:DeprecationWarning
    ignore:.*Trying to unpickle estimator.*:UserWarning
    ignore:.*Trying to unpickle estimator.*:
    ignore:.*BlockingPortal.*:DeprecationWarning
    # SHAP colormap deprecation warnings
    ignore:.*set_bad.*:PendingDeprecationWarning
    ignore:.*set_over.*:PendingDeprecationWarning
    ignore:.*set_under.*:PendingDeprecationWarning
markers =
    clip: marks tests that require the CLIP model + ABO images on disk (deselect with -m "not clip")
