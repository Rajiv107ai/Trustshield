version: "3.8"

# ==============================================================================
# TrustShield AI — Single API Container Architecture
# ==============================================================================

services:
  trustshield-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trustshield-api
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - LOG_LEVEL=${LOG_LEVEL:-info}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/ready"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
