version: "3.8"

# ==============================================================================
# TrustShield AI — Orchestrated Service Mesh
# Services:
#   1. trustshield-api: FastAPI Real-Time Fraud Scoring & Trust Engine Gateway
#   2. neo4j: Property Graph Database for Multi-Hop Collusion Ring Investigation
#   3. redis: In-Memory Low-Latency Feature Store & Distributed Cache
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. TrustShield FastAPI Scoring Gateway
  # ----------------------------------------------------------------------------
  trustshield-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trustshield-api
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_HTTP_URI=http://neo4j:7474
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-trustshield_secret}
      - REDIS_URL=redis://redis:6379/0
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/ready"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - trustshield-net

  # ----------------------------------------------------------------------------
  # 2. Neo4j Property Graph Database
  # ----------------------------------------------------------------------------
  neo4j:
    image: neo4j:5.20.0-community
    container_name: trustshield-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"  # Neo4j Browser Web Interface
      - "7687:7687"  # Bolt Binary Protocol
    environment:
      - NEO4J_AUTH=${NEO4J_AUTH:-neo4j/trustshield_secret}
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
      - NEO4J_dbms_security_procedures_allowlist=apoc.*
      - NEO4J_dbms_memory_heap_initial__size=512m
      - NEO4J_dbms_memory_heap_max__size=1G
      - NEO4J_dbms_memory_pagecache_size=512m
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_import:/var/lib/neo4j/import
      - neo4j_plugins:/plugins
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    networks:
      - trustshield-net

  # ----------------------------------------------------------------------------
  # 3. Redis In-Memory Feature Store & Distributed Cache
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7.2-alpine
    container_name: trustshield-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - trustshield-net

  # ----------------------------------------------------------------------------
  # 4. Prometheus Metrics Scraper & TSDB Time-Series Engine
  # ----------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: trustshield-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    depends_on:
      - trustshield-api
    networks:
      - trustshield-net

  # ----------------------------------------------------------------------------
  # 5. Grafana Enterprise Observability Dashboard
  # ----------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:10.4.0
    container_name: trustshield-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-trustshield_admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - trustshield-net

# ==============================================================================
# Persistent Named Volumes
# ==============================================================================
volumes:
  neo4j_data:
    driver: local
  neo4j_logs:
    driver: local
  neo4j_import:
    driver: local
  neo4j_plugins:
    driver: local
  redis_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

# ==============================================================================
# Dedicated Bridge Network
# ==============================================================================
networks:
  trustshield-net:
    driver: bridge
