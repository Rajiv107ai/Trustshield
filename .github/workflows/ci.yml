name: TrustShield CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  # ============================================================================
  # 1. Code Quality, Syntax & Type Analysis
  # ============================================================================
  lint-and-typecheck:
    name: Code Quality & Type Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install Linting & Core Tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Flake8 Syntax & Critical Name Resolution Check (E9, F63, F7, F82)
        run: |
          # Fails if syntax errors or undefined symbols (e.g. missing imports) exist
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=.venv,external,synthetic_data_export

      - name: Setup Node.js for Pyright
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Production & Model Dependencies
        run: |
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Pyright Static Type Analysis
        run: |
          npx --yes pyright


  # ============================================================================
  # 2. Automated Test Suite Execution
  # ============================================================================
  test:
    name: Pytest Automated Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Execute Core Test Suite (Excluding heavy offline CLIP downloads)
        run: |
          pytest -v -m "not clip" --tb=short

      - name: Verify FastAPI Backend Serving Layer Integration
        run: |
          pytest tests/api/test_scoring_api.py tests/reliability/test_system_extensions.py tests/services/test_services.py -v --tb=short

      - name: Verify Metric Grounding & Absence of Hard-Coded Metrics
        run: |
          python scripts/check_no_hardcoded_metrics.py


  # ============================================================================
  # 3. Reliability Failure-Injection & Metadata-Only Release Gates
  # ============================================================================
  reliability-release-gate:
    name: Reliability & Release Gates
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run Failure-Injection Reliability Tests
        run: |
          pytest tests/reliability/test_failure_injection.py -v --tb=short

      - name: Verify Critical OpenAPI Contract
        run: python scripts/check_openapi_contract.py

      - name: Build CI Release Manifest
        run: |
          python scripts/build_release_manifest.py --output models/release_manifest.json

      - name: Verify Metadata-Only Release Gate
        run: |
          python scripts/verify_release_gate.py \
            --manifest models/release_manifest.json \
            --benchmark models/http_benchmark_results.json

      - name: Verify Scientific Benchmark Results
        run: python scripts/verify_results.py

      - name: Verify Production Invariance (29-Field Schema)
        run: python scripts/verify_production_invariance.py

  # ============================================================================
  # 4. Next.js Enterprise Frontend Build & Typecheck Verification
  # ============================================================================
  frontend-build:
    name: Next.js Frontend Build & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build Next.js Production Bundle
        working-directory: ./frontend
        run: npm run build

      - name: Frontend ESLint Check
        working-directory: ./frontend
        run: npm run lint

  # ============================================================================
  # 5. Multi-Stage Docker Container Build Verification
  # ============================================================================
  docker-build:
    name: Production Container Build Check
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test, reliability-release-gate, frontend-build]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: trustshield-api:${{ github.sha }}
